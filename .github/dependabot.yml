version: 2

updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      maven-wrapper:
        patterns:
          - "org.apache.maven.wrapper:maven-wrapper"
          - "org.apache.maven:apache-maven"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
